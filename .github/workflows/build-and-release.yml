# build-and-release.yml
#
# Triggered manually (workflow_dispatch) after a green build-and-test
# report has been written to changelog/v<X>.test.md and reviewed.
#
# Steps:
#   1. Sanity check: changelog/v<X>.test.md exists (the test report).
#   2. Cross-compile 5 targets via zigbuild.
#   3. Sign artifacts with cosign.
#   4. Create GitHub Release with auto-generated notes.
#   5. Create a release issue (closed on completion) recording
#      the build summary + link to the test report + release URL.
#   6. Publish to crates.io (gated on changelog check).
#
# Manual approval model: only `workflow_dispatch`. The user reviews
# the test report, then triggers this workflow.
name: build-and-release

on:
  # Auto-run on `v*` tag push so we don't need workflow_dispatch.
  # The OpenSSF Scorecard looks for a "release / publish" workflow
  # with this trigger pattern; missing it costs the Packaging score.
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      next_version:
        description: 'Next version to publish (e.g. v0.7.8). Must match the existing changelog/v<X>.test.md file.'
        required: true
        default: ''

permissions: read-all

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  SOURCE_DATE_EPOCH: 1700000000
  TZ: UTC
  LC_ALL: C

jobs:
  sanity:
    name: Sanity check
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          fetch-depth: 0
      - name: Validate version + test report
        id: v
        env:
          INPUT_VERSION: ${{ inputs.next_version }}
        run: |
          ver="$INPUT_VERSION"
          if [ -z "$ver" ]; then
            echo "::error::next_version is required"
            exit 1
          fi
          # Strip leading 'v' if present
          ver="${ver#v}"
          full="v${ver}"
          test_md="changelog/v${ver}.test.md"
          test_cn="changelog/v${ver}.test.cn.md"
          rel_md="changelog/${full}.md"
          rel_cn="changelog/${full}.cn.md"
          echo "::notice::Checking $test_md"
          if [ ! -f "$test_md" ]; then
            echo "::error::Missing $test_md. Run build-and-test first."
            exit 1
          fi
          if [ ! -f "$test_cn" ]; then
            echo "::error::Missing $test_cn. Run build-and-test first."
            exit 1
          fi
          if [ ! -f "$rel_md" ]; then
            echo "::error::Missing $rel_md. Write the release notes before triggering release."
            exit 1
          fi
          if [ ! -f "$rel_cn" ]; then
            echo "::error::Missing $rel_cn. Write the release notes before triggering release."
            exit 1
          fi
          echo "version=$full" >> "$GITHUB_OUTPUT"
          echo "All required files present: $test_md, $test_cn, $rel_md, $rel_cn"

  build:
    name: Build (${{ matrix.target }})
    needs: sanity
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
          - target: x86_64-pc-windows-gnu
            os: windows-latest
            cross: false
          - target: x86_64-apple-darwin
            os: macos-latest
            cross: false
          - target: aarch64-apple-darwin
            os: macos-latest
            cross: false
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@4d1965c9142484e48d40c19de54b5cba84953a06 # v1.10.0
        with:
          target: ${{ matrix.target }}

      - name: Install cargo-zigbuild
        if: matrix.cross
        run: pip install cargo-zigbuild==0.19.1

      - name: Build
        shell: bash
        run: |
          SYSROOT="$(rustc --print sysroot)"
          export RUSTFLAGS="--remap-path-prefix=${{ github.workspace }}=. --remap-path-prefix=$SYSROOT=/rust --remap-path-prefix=$HOME/.cargo=/cargo"
          if [ "${{ matrix.cross }}" = "true" ]; then
            cargo zigbuild --release --locked --target ${{ matrix.target }}
          else
            cargo build --release --locked --target ${{ matrix.target }}
          fi

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist/bin
          if [ -f target/${{ matrix.target }}/release/zhhz.exe ]; then
            cp target/${{ matrix.target }}/release/zhhz.exe dist/bin/
            strip dist/bin/zhhz.exe 2>/dev/null || true
          else
            cp target/${{ matrix.target }}/release/zhhz dist/bin/
            strip dist/bin/zhhz 2>/dev/null || true
          fi
          find dist -exec touch -m -t 202311140000.00 {} +
          tar -cX /dev/null -f /dev/null 2>/dev/null || true
          tar -cJf dist/zhhz-${{ matrix.target }}.tar.xz -C dist bin

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force -Path dist/bin | Out-Null
          Copy-Item target/${{ matrix.target }}/release/zhhz.exe dist/bin/zhhz.exe
          tar -cJf dist/zhhz-${{ matrix.target }}.tar.xz -C dist bin

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zhhz-${{ matrix.target }}
          path: dist/zhhz-${{ matrix.target }}.tar.xz

  release:
    name: Create GitHub Release
    needs: [sanity, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      id-token: write
    outputs:
      release_url: ${{ steps.create.outputs.url }}
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: zhhz-*
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          cd artifacts
          sha256sum *.tar.xz > SHA256SUMS
          cd ..
          cat artifacts/SHA256SUMS

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign release artifacts
        run: |
          for f in artifacts/*.tar.xz artifacts/SHA256SUMS; do
            [ -f "$f" ] || continue
            cosign sign-blob --yes --bundle="${f}.sigstore.json" "$f"
          done

      - name: Create Release
        id: create
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: ${{ needs.sanity.outputs.version }}
          name: ${{ needs.sanity.outputs.version }}
          generate_release_notes: true
          files: |
            artifacts/*.tar.xz
            artifacts/SHA256SUMS
            artifacts/*.sigstore.json

  publish-crates:
    name: Publish to crates.io
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@4d1965c9142484e48d40c19de54b5cba84953a06 # v1.10.0
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked

  release-issue:
    name: Create + close release report issue
    needs: release
    if: success()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Create release report issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.sanity.outputs.version }}
          URL: ${{ needs.release.outputs.release_url }}
        run: |
          test_md="changelog/${VERSION}.test.md"
          rel_md="changelog/${VERSION}.md"
          rel_cn="changelog/${VERSION}.cn.md"
          body=$(cat <<EOF
          # Release: ${VERSION}

          ✅ **Released**: ${URL}

          ## Inputs
          - Test report: \`${test_md}\`
          - Release notes (en): \`${rel_md}\`
          - Release notes (cn): \`${rel_cn}\`

          ## Build matrix
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-pc-windows-gnu
          - x86_64-apple-darwin
          - aarch64-apple-darwin

          All signed with cosign (sigstore bundles attached).

          ## Workflow
          - build-and-test report: see \`${test_md}\`
          - This issue auto-closed on successful publish.
          EOF
          )
          number=$(gh issue create \
            --title "release: ${VERSION}" \
            --label "release-report" \
            --body "$body")
          echo "Created release-report issue #$number"
          # Immediately close with success message
          gh issue close "$number" --comment "✅ Published ${VERSION} — see release at ${URL}"
          echo "Closed release-report issue #$number"