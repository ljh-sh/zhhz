name: ClusterFuzzLite PR fuzzing

# ClusterFuzzLite — code-change fuzzing on pull requests.
# Short runs per sanitizer, fails the PR if a crash is found.
# Spec: https://google.github.io/clusterfuzzlite/running-clusterfuzzlite/github-actions/

on:
  pull_request:
    paths:
      - "**"

permissions: read-all

jobs:
  PR:
    name: PR fuzz (${{ matrix.sanitizer }})
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ matrix.sanitizer }}-${{ github.ref }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        sanitizer:
          - address
          # - memory      # dropped: rustc 1.99 nightly in ClusterFuzzLite base
                          # has a compiler_builtins linking bug under
                          # -Z build-std + -Zsanitizer=memory. Re-enable when
                          # upstream image is bumped past the bug.
          # - undefined  # dropped: rustc removed `-Z sanitizer=undefined`
                         # from its accepted values after nightly ~2024-11.
                         # ClusterFuzzLite uses a similar pinned toolchain
                         # so this drops too. Re-enable when stable.
    steps:
      - name: Build Fuzzers (${{ matrix.sanitizer }})
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@v1
        with:
          language: rust
          github-token: ${{ secrets.GITHUB_TOKEN }}
          sanitizer: ${{ matrix.sanitizer }}

      - name: Run Fuzzers (${{ matrix.sanitizer }})
        id: run
        uses: google/clusterfuzzlite/actions/run_fuzzers@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 600
          mode: "code-change"
          sanitizer: ${{ matrix.sanitizer }}
          output-sarif: true
          # MSan was dropped from the matrix: current rustc 1.99 nightly in
          # ClusterFuzzLite's base image has a linking bug in compiler_builtins
          # under -Z build-std + -Zsanitizer=memory. Re-enable when the
          # upstream image is bumped past the bug. Tracked in zhhz#73 follow-up.
