name: WASM (zhhz)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: read-all

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  wasm:
    name: Build & test the WebAssembly bindings
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.1.7

      - name: Setup Rust (pinned)
        uses: actions-rust-lang/setup-rust-toolchain@4d1965c9142484e48d40c19de54b5cba84953a06 # v1.10.0
        with:
          toolchain: stable-2024-11-28
          target: wasm32-unknown-unknown
          # `wasm32-unknown-unknown` is added by the toolchain; this also
          # fetches the matching `rust-std` component.
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2.7.7
        with:
          cache-on-failure: true

      - name: Install wasm-pack (pinned)
        # Pin via WASM_PACK_VERSION so a future wasm-pack release with a
        # different JS glue format can't silently change the published
        # artifact. Bump deliberately.
        run: curl -fsSL https://rustwasm.github.io/wasm-pack/installer/init.sh | sh
        env:
          WASM_PACK_VERSION: v0.13.0

      - name: Build (nodejs target)
        # `wasm-pack build` defaults to the release profile, so we do NOT
        # pass `--release` here; doing so makes cargo see the flag twice
        # ("--release cannot be used multiple times") and abort.
        run: wasm-pack build --target nodejs --features wasm

      - name: Smoke test in Node
        # The bundler target produces ESM glue (`"type": "module"`); load via
        # dynamic import so a single script runs against any wasm-pack target.
        run: |
          node --version
          node --input-type=module -e '
            const mod = await import("./pkg/zhhz.js");
            const { convert, convert_with_custom, detect, listConfigs, listLocales, configForRegionPair, Converter } = mod;

            function assert(label, actual, expected) {
              if (actual !== expected) {
                console.error("FAIL:", label, "expected", JSON.stringify(expected), "got", JSON.stringify(actual));
                process.exit(1);
              }
              console.log("ok:", label, "->", JSON.stringify(actual));
            }

            // 1. cn-s -> cn-t (OpenCC standard)
            assert("s2t", convert("汉字计算机软件", "s2t"), "漢字計算機軟件");
            // 2. cn-tw (with phrases) -> cn-s (A -> 甲 is Taiwan-style)
            assert("tw2sp", convert("他感染了A型肝炎", "tw2sp"), "他感染了甲型肝炎");
            // 3. detect — zhhz-only capability vs opencc-js
            const d = detect("他去了西維珍尼亞州");
            assert("detect.region", d && d.region, "cn-hk");
            if (!d || d.confidence < 30) {
              console.error("FAIL: detect.confidence", d && d.confidence, "expected >= 30");
              process.exit(1);
            }
            // 4. convert_with_custom — array form (zhhz#40).
            assert(
              "convert_with_custom array",
              convert_with_custom("买软件", "s2t", [["软件", "軟體"]]),
              "買軟體"
            );
            // 5. convert_with_custom — string form (opencc-js DictLike compat).
            assert(
              "convert_with_custom string",
              convert_with_custom("香蕉", "s2t", "香蕉 banana|蘋果 apple"),
              "banana"
            );
            // 6. Introspection (better than opencc-js: flat lists).
            assert("listConfigs length", listConfigs().length, 16);
            assert("listConfigs contains s2twp", listConfigs().includes("s2twp"), true);
            assert("listLocales length", listLocales().length, 6);
            assert("listLocales contains cn-tw", listLocales().includes("cn-tw"), true);
            // 7. Semantic region -> config (zhhz-only vs opencc-js).
            assert("configForRegionPair cn-s->cn-tw", configForRegionPair("cn-s", "cn-tw"), "s2twp");
            assert("configForRegionPair cn-s->cn-hk", configForRegionPair("cn-s", "cn-hk"), "s2hkp");
            // 8. Converter class (factory instance; strictly better than
            //    opencc-js's closure factory: also exposes .config + per-call
            //    .convertWithCustom + .withCustom).
            const c = new Converter("s2twp");
            assert("Converter c.config", c.config, "s2twp");
            assert("Converter c.convert", c.convert("信息"), "資訊");
            assert(
              "Converter c.convertWithCustom",
              c.convertWithCustom("买软件", [["软件", "軟體"]]),
              "買軟體"
            );
            const c2 = Converter.forRegion("cn-s", "cn-tw");
            assert("Converter.forRegion config", c2.config, "s2twp");
            assert("Converter.forRegion convert", c2.convert("鼠标"), "滑鼠");
            const c3 = c.withCustom([["软件", "軟體"]]);
            assert("Converter.withCustom convert", c3.convert("买软件"), "買軟體");
            // 9. Error paths surface a useful message.
            let threw = false;
            try { convert("hello", "bogus"); } catch (e) { threw = true; }
            assert("bad config throws", threw, true);
            threw = false;
            try { convert_with_custom("hello", "s2t", ""); } catch (e) { threw = true; }
            assert("empty custom dict throws", threw, true);
          '

      - name: Build (web target for browsers)
        run: wasm-pack build --target web --features wasm
        # produces pkg/ again (overwrites) — kept as a final sanity check that
        # the web build also succeeds (different JS glue generation than nodejs).

  publish:
    name: Publish npm package
    needs: wasm
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.1.7

      - name: Setup Rust (pinned) + add wasm32 target
        uses: actions-rust-lang/setup-rust-toolchain@4d1965c9142484e48d40c19de54b5cba84953a06 # v1.10.0
        with:
          toolchain: stable-2024-11-28
          target: wasm32-unknown-unknown

      - name: Install wasm-pack (pinned)
        run: curl -fsSL https://rustwasm.github.io/wasm-pack/installer/init.sh | sh
        env:
          WASM_PACK_VERSION: v0.13.0

      # Build into `pkg/` for the npm publish. This job runs after the
      # `wasm` smoke job (sequential), so overwriting the same `pkg/`
      # output is intentional. The bundler target writes ESM glue +
      # .wasm + .d.ts + package.json.
      - name: Build (bundler-friendly npm target)
        run: wasm-pack build --target bundler --features wasm

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish pkg --access public

  publish-dryrun:
    # Exercise the publish path without burning an npm version.
    # Trigger from the GH UI: Actions → WASM (zhhz) → Run workflow.
    # Verifies (a) the bundler build produces the expected entry files,
    # (b) the tarball composition is what we expect, (c) auth fails
    # loudly if NPM_TOKEN is missing (rather than silently on tag push).
    name: Publish npm package (dry-run)
    needs: wasm
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.1.7

      - name: Setup Rust (pinned) + add wasm32 target
        uses: actions-rust-lang/setup-rust-toolchain@4d1965c9142484e48d40c19de54b5cba84953a06 # v1.10.0
        with:
          toolchain: stable-2024-11-28
          target: wasm32-unknown-unknown

      - name: Install wasm-pack (pinned)
        run: curl -fsSL https://rustwasm.github.io/wasm-pack/installer/init.sh | sh
        env:
          WASM_PACK_VERSION: v0.13.0

      - name: Build (bundler target into pkg/)
        run: wasm-pack build --target bundler --features wasm

      - name: Verify tarball composition
        run: |
          set -euo pipefail
          cd pkg
          echo "--- package.json metadata ---"
          node -e '
            const p = require("./package.json");
            for (const k of ["name","version","license","main","module","types","files"]) {
              console.log(k, "=", JSON.stringify(p[k]));
            }
            if (p.name !== "zhhz")       { console.error("FAIL: name != zhhz"); process.exit(1); }
            if (p.license !== "Apache-2.0") { console.error("FAIL: license != Apache-2.0"); process.exit(1); }
            if (!p.main || !p.types)       { console.error("FAIL: missing main/types"); process.exit(1); }
          '
          echo "--- entry files ---"
          for f in zhhz.js zhhz_bg.wasm zhhz.d.ts package.json README.md; do
            if [ ! -f "$f" ]; then
              echo "FAIL: missing $f"
              ls -la
              exit 1
            fi
            echo "ok: $f ($(wc -c < "$f") bytes)"
          done
          echo "--- npm pack --dry-run ---"
          npm pack --dry-run
          echo "--- load smoke from the package ---"
          node --input-type=module -e '
            const { convert, convert_with_custom, detect, listConfigs, listLocales, configForRegionPair, Converter } = await import("./zhhz.js");
            if (convert("汉字","s2t") !== "漢字") { console.error("smoke fail"); process.exit(1); }
            if (convert_with_custom("买软件","s2t",[["软件","軟體"]]) !== "買軟體") { console.error("custom fail"); process.exit(1); }
            if (convert_with_custom("香蕉","s2t","香蕉 banana|蘋果 apple") !== "banana") { console.error("custom-string fail"); process.exit(1); }
            const d = detect("他去了西維珍尼亞州");
            if (!d || d.region !== "cn-hk") { console.error("detect fail"); process.exit(1); }
            if (listConfigs().length !== 16) { console.error("listConfigs fail"); process.exit(1); }
            if (listLocales().length !== 6) { console.error("listLocales fail"); process.exit(1); }
            if (configForRegionPair("cn-s","cn-tw") !== "s2twp") { console.error("configForRegionPair fail"); process.exit(1); }
            const c = new Converter("s2twp");
            if (c.convert("信息") !== "資訊") { console.error("Converter fail"); process.exit(1); }
            console.log("dry-run OK");
          '