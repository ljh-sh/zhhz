name: Fuzz

# Three sanitizers × two fuzz targets, run on a nightly cron and on
# manual dispatch. Weekly cron kept as a fallback for the OSS-Fuzz
# hand-off evidence trail. Permissions are minimal (contents: read only).

on:
  schedule:
    # Nightly run — long enough to discover real bugs.
    - cron: "17 4 * * *"
    # Weekly backup run — kept so even if the nightly breaks we have a
    # green record every week for OSS-Fuzz hand-off evidence.
    - cron: "0 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: ${{ matrix.target }} · ${{ matrix.sanitizer }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - fmm_segment
          - convert_roundtrip
        sanitizer:
          - address
          - memory
          - ubsan
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust stable
        uses: actions-rust-lang/setup-rust-toolchain@4d1965c9142484e48d40c19de54b5cba84953a06 # v1.10.0
        with:
          toolchain: stable-2024-11-28
          components: rustfmt, clippy

      - name: Install pinned nightly (sanitizers + cargo-fuzz)
        # `-Z sanitizer=undefined` was removed from rustc after nightly
        # ~2024-11; nightly-2024-09-01 still accepts all three (address,
        # memory, undefined) so we pin there for the GH Actions matrix.
        run: |
          rustup toolchain install nightly-2024-09-01 --profile minimal --component rust-src

      - name: cargo +nightly-2024-09-01 install cargo-fuzz
        run: cargo +nightly-2024-09-01 install cargo-fuzz

      - name: Run fuzzer (${{ matrix.sanitizer }}, 60s)
        # cargo-fuzz injects `-Zsanitizer=address` for coverage instrumentation,
        # so naively setting RUSTFLAGS=-Z sanitizer=<s> activates two
        # sanitizers at once and the build fails. We work around it by
        # building with `cargo fuzz build --sanitizer=none` (no sanitizer
        # flag from cargo-fuzz) and adding the matrix sanitizer through
        # RUSTFLAGS.
        #
        # Matrix uses `ubsan` (not `undefined`) because GitHub Actions
        # silently drops matrix jobs whose value is the literal
        # `undefined`. The bash branch below maps the friendly matrix
        # name `ubsan` to the rustc value `undefined` that `-Z sanitizer=`
        # accepts.
        run: |
          cd fuzz
          if [ "${{ matrix.sanitizer }}" = "ubsan" ]; then
            RUSTFLAGS="-Z sanitizer=undefined" \
              cargo +nightly-2024-09-01 fuzz build --sanitizer=none ${{ matrix.target }}
          else
            RUSTFLAGS="-Z sanitizer=${{ matrix.sanitizer }}" \
              cargo +nightly-2024-09-01 fuzz build --sanitizer=none ${{ matrix.target }}
          fi
          BINARY=$(find target -type f -name "${{ matrix.target }}" -perm -u+x | head -n1)
          if [ -z "$BINARY" ]; then
            echo "::error::Built binary not found for ${{ matrix.target }}"
            exit 1
          fi
          echo "Running $BINARY"
          "$BINARY" -max_total_time=60

      - name: Upload corpus on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-corpus-${{ matrix.target }}-${{ matrix.sanitizer }}
          path: fuzz/corpus/${{ matrix.target }}/
          retention-days: 14

      - name: Upload crash artifacts on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-crash-${{ matrix.target }}-${{ matrix.sanitizer }}
          path: fuzz/artifacts/${{ matrix.target }}/
          retention-days: 30
          if-no-files-found: ignore
