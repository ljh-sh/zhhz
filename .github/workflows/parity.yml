# Parity (zhhz vs opencc @ vendored data)
#
# Long-term tracking. Not a PR blocker.
#
# Why this isn't a required check: the opencc reference CLI frequently
# diverges from zhhz on inputs that involve word-frequency
# disambiguation (e.g. 齣/出, 着/著) where opencc and zhhz make
# different — but both correct — choices based on the FMM vs n-gram
# segmentation they use. These are not bugs; they are documented
# algorithmic differences. Gating PRs on this would create noisy
# red ❌ for every PR touching the segmentation pipeline.
#
# Instead, this workflow:
#   1. Runs weekly (Sunday 03:00 UTC) on schedule
#   2. Runs on workflow_dispatch for ad-hoc reproduction
#   3. Builds opencc from data/UPSTREAM (same dictionary data)
#   4. Runs cargo run --example parity to diff zhhz vs opencc
#   5. If there are deltas, opens a `parity-tracking` issue with
#      the diff attached as a workflow artifact
#   6. If clean, exits silently (job succeeds, no issue opened)
#
# The `parity-tracking` label is the long-term record. Each new
# issue represents one new algorithmic delta worth tracking.
name: Parity (zhhz vs opencc) — long-term tracking

on:
  # Weekly cron. Open parity-tracking issues on regressions.
  schedule:
    - cron: "0 3 * * 0"
  # Ad-hoc run from the GH UI for triage.
  workflow_dispatch:

permissions:
  contents: read
  # To open / update parity-tracking issues.
  issues: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  parity:
    name: Differential parity (zhhz vs opencc @ vendored data)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install build deps (cmake, C++ compiler, python3)
        run: sudo apt-get update && sudo apt-get install -y cmake g++ python3

      - name: Setup Rust (pinned)
        uses: actions-rust-lang/setup-rust-toolchain@4d1965c9142484e48d40c19de54b5cba84953a06 # v1.10.0
        with:
          toolchain: stable-2024-11-28
          components: rustfmt, clippy

      - name: Build opencc reference from data/UPSTREAM
        run: scripts/build-reference-opencc.sh ./reference-opencc

      - name: Differential parity (zhhz vs opencc @ vendored data)
        id: parity
        env:
          OPENCC_BIN: ${{ github.workspace }}/reference-opencc/bin/opencc
          OPENCC_DATA_DIR: ${{ github.workspace }}/reference-opencc/share/opencc
        run: |
          # Run the example. Its exit code is the diff count:
          # 0 = byte-identical, >0 = number of deltas. We don't fail
          # the job — we just capture the report.
          set +e
          cargo run --example parity > parity-report.txt 2>&1
          rc=$?
          set -e
          echo "parity exit: $rc"
          head -200 parity-report.txt
          exit 0

      - name: Upload parity report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: parity-report
          path: parity-report.txt
          retention-days: 90

      # The issue-body markdown lives in a separate file so the
      # YAML parser (and dependabot's rebase diff) sees a clean
      # multi-line `run:` block instead of an unterminated quoted
      # string spanning many lines (which broke dependabot parsing).
      - name: Write parity issue body template
        run: |
          cat > /tmp/parity-body.md <<'PARITY_BODY_EOF'
          Weekly `.github/workflows/parity.yml` run found __DELTAS__ delta lines between zhhz and opencc at the vendored data version.

          This is **not necessarily a bug** — opencc and zhhz make different
          (but both correct) choices on word-frequency-disambiguation inputs
          (e.g. 齣/出, 着/著). Each new delta represents a tracking item,
          not a defect.

          ## Diff report (first 200 lines)

          ```
          __BODY__
          ```

          ## Triage

          - If the delta is a known segmentation choice: close with a comment
            linking the `data/UPSTREAM` commit that introduced it.
          - If the delta is a real zhhz regression: convert this to a regular
            bug issue, fix in a PR, and reference here.

          Report artifact: see this run's `parity-report` artifact.
          PARITY_BODY_EOF
          sed -i 's/^          //' /tmp/parity-body.md

      - name: Open parity-tracking issue on regression
        if: hashFiles('parity-report.txt') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPORT: ${{ github.workspace }}/parity-report.txt
        run: |
          deltas=$(grep -cE '^[-+][^-+ ]' parity-report.txt || true)
          echo "delta lines: $deltas"
          if [ "$deltas" = "0" ]; then
            echo "No deltas — zhhz output is byte-identical to opencc."
            exit 0
          fi
          if [ "$deltas" -lt 5 ]; then
            echo "Minor diffs ($deltas lines) — known algorithmic differences, skipping issue."
            exit 0
          fi
          body=$(head -200 parity-report.txt)
          sed -e "s/__DELTAS__/$deltas/g" -e "s/__BODY__/$body/g" /tmp/parity-body.md > /tmp/parity-body-final.md
          existing=$(gh issue list --label "parity-tracking" --state open \
            --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [ -n "$existing" ] && [ "$existing" != "null" ]; then
            gh issue comment "$existing" --body-file /tmp/parity-body-final.md
            echo "Updated existing issue #$existing"
          else
            gh issue create \
              --title "parity: $deltas delta lines vs opencc @ $(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --label "parity-tracking" \
              --body-file /tmp/parity-body-final.md
            echo "Opened new parity-tracking issue"
          fi